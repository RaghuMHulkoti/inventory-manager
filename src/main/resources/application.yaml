spring:
  application:
    name: inventory-manager
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD:"@2ztrn322hyR"}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        default_schema: INVENTORY
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: INVENTORY
    default-schema: INVENTORY


management:
  otlp:
    metrics:
      export:
        enabled: true
        # Pushes the same Micrometer metrics the Prometheus endpoint serves, so Grafana Cloud needs no scraper.
        # Auth: set MANAGEMENT_OTLP_METRICS_EXPORT_HEADERS_AUTHORIZATION="Basic <base64 instanceId:token>".
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    data:
      repository:
        autotime:
          enabled: true
          percentiles-histogram: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  tomcat:
    mbeanregistry:
      enabled: true
