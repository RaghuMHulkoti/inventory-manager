spring:
  application:
    name: inventory-manager
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:production-fgivv4.eu.cluster.ntail.io:9092}
    # Cloud cluster login. Only the password is a secret: set KAFKA_PASSWORD in the environment, never in this file.
    # For a local plaintext broker set KAFKA_SECURITY_PROTOCOL=PLAINTEXT and KAFKA_BOOTSTRAP_SERVERS=localhost:9092.
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:default}" password="${KAFKA_PASSWORD:}";
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
    consumer:
      group-id: inventory-manager
      auto-offset-reset: earliest
      enable-auto-commit: false
  datasource:
    url: jdbc:oracle:thin:@ecommerce_tp?TNS_ADMIN=${WALLET_DIR:/Users/raghavendra/Downloads/Wallet_ECOMMERCE}
    username: ${DB_USERNAME:ADMIN}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        default_schema: INVENTORY
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: INVENTORY
    default-schema: INVENTORY


management:
  otlp:
    metrics:
      export:
        enabled: true
        # Pushes the same Micrometer metrics the Prometheus endpoint serves, so Grafana Cloud needs no scraper.
        # Auth headers come from OTEL_EXPORTER_OTLP_HEADERS; only active while OTEL_METRICS_EXPORTER=otlp.
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 30s
        base-time-unit: seconds
        resource-attributes:
          service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
    data:
      repository:
        autotime:
          enabled: true
          percentiles-histogram: true
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  tomcat:
    mbeanregistry:
      enabled: true

inventory:
  events:
    # log = print events (no broker needed); kafka = publish the outbox to the topic below
    publisher: ${EVENTS_PUBLISHER:log}
    topic: domain.inventory.events
    # true = hold stock when Order Service publishes ORDER_CREATED
    consumer-enabled: ${EVENTS_CONSUMER_ENABLED:false}
    # Topics are created at startup with these partition counts (free cluster quota: 10 topics, 64 partitions)
    create-topics: ${EVENTS_CREATE_TOPICS:true}
    partitions: 3
    order-topic: domain.order.events
  outbox:
    poll-interval: 1s
    batch-size: 100
  jobs:
    enabled: true
